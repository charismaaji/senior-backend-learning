services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev

    container_name: todo-app

    env_file:
      - .env

    ports:
      - "4000:3000"

    volumes:
      - .:/app
      - bun-node-modules:/app/node_modules

    command: bun run dev

    depends_on:
      postgres:
        condition: service_healthy

      migrate:
        condition: service_completed_successfully

    restart: unless-stopped

  postgres:
    image: postgres:17

    container_name: postgres-db

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

    ports:
      - "5435:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev

    env_file:
      - .env

    environment:
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable"
      DBMATE_MIGRATIONS_DIR: /app/db/migrations

    volumes:
      - .:/app
      - bun-node-modules:/app/node_modules

    command: bun run db:migrate

    depends_on:
      postgres:
        condition: service_healthy

    restart: "no"

volumes:
  postgres-data:
  bun-node-modules:
